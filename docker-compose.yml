version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: timehub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-timehub_db}
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - timehub_network

  app:
    build: .
    container_name: timehub-app-backend
    restart: always
    env_file:
      - .env
    depends_on:
      - mysql
    ports:
      - "${PORT:-3001}:3001"
    networks:
      - timehub_network

volumes:
  mysql_data:

networks:
  timehub_network:
    driver: bridge
