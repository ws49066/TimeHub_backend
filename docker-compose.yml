services:
  mysql:
    image: mysql:8.0
    container_name: timehub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: timehub_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - timehub_network
  
  app:
    build: .
    container_name: timehub-app-backend
    restart: always
    env_file:
      - .env
    depends_on:
      - mysql
    ports:
      - "3001:3001"
    networks:
      - timehub_network


volumes:
  mysql_data:

networks:
  timehub_network:
    driver: bridge
